tags:
  - Contacts
summary: Update contact by id
operationId: updateContact
description: "Update contact by id"
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: "65ca67e7ae7f10c88b598384"
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            example: "John Doe"
          phone:
            type: string
            example: "+1234567890"
responses:
  "200":
    description: "Successfully updated the contact"
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: "Successfully updated the contact!"
            data:
              type: object
              $ref: "../../../components/schemas/contact.yaml"
  "404":
    $ref: "../../../components/responses/404.yaml"
  "401":
    $ref: "../../../components/responses/401.yaml"
