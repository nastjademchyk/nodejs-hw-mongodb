tags:
  - Contacts
summary: Create contact
operationId: createContact
description: "Create a contact with payload"
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - email
          - isFavourite
          - contactType
          - userId
        properties:
          name:
            description: "Contact's name"
            type: string
            example: "Nastja Doe"
          phoneNumber:
            description: "Contact's phone Number"
            type: number
            example: 794712833
          email:
            description: "Contact's email"
            type: string
            example: "nastja@gmail.com"
          isFavourite:
            description: "Is it favorite contact?"
            type: boolean
            example: true
          contactType:
            type: string
            enum: ["work", "home", "personal"]
            example: "personal"
          photo:
            description: "Contact's photo"
            type: string
            format: binary
responses:
  "201":
    description: Creates a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact!
            data:
              type: object
              $ref: ../../components/schemas/contact.yaml
  "401":
    $ref: "../../components/responses/401.yaml"
